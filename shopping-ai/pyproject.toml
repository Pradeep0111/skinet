[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skinet-shopping-ai"
version = "0.1.0"
description = "Internal AI shopping assistant service for Skinet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "fastapi>=0.115,<1.0",
  "httpx2>=2.9,<3.0",
  "langgraph>=1.2.10",
  "pydantic-settings>=2.6,<3.0",
  "redis",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
